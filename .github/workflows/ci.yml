name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Swift toolchain
        run: xcrun swiftc -version
      - name: Run tests
        run: zsh scripts/test.sh
      - name: Build application
        run: zsh scripts/build.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict "build/Auto Backup.app"
          plutil -lint "build/Auto Backup.app/Contents/Info.plist"
      - name: Package test build
        run: ditto -c -k --sequesterRsrc --keepParent "build/Auto Backup.app" "build/AutoBackup-${{ runner.arch }}.zip"
      - name: Upload test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoBackup-${{ runner.arch }}
          path: build/AutoBackup-${{ runner.arch }}.zip
          retention-days: 14
          if-no-files-found: error
