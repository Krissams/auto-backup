name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Swift toolchain
        run: xcrun swiftc -version
      - name: Run tests
        run: zsh scripts/test.sh
      - name: Build application
        run: zsh scripts/build.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict "build/Auto Backup.app"
          plutil -lint "build/Auto Backup.app/Contents/Info.plist"
      - name: Package test build
        run: ditto -c -k --sequesterRsrc --keepParent "build/Auto Backup.app" "build/AutoBackup-${{ runner.arch }}.zip"
      - name: Upload test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AutoBackup-${{ runner.arch }}
          path: build/AutoBackup-${{ runner.arch }}.zip
          retention-days: 14
          if-no-files-found: error
